# Publishes site/ to GitHub Pages through the gh-pages branch: each run replaces that branch with one commit
# holding site/, and GitHub serves it (Settings → Pages → Source: "Deploy from a branch", gh-pages, / (root))
# with its own "pages build and deployment" run. Needs only the default GITHUB_TOKEN.
# Vercel serves the same folder: import the repo and set Root Directory to "site" (no build step).
name: pages

on:
  push:
    branches: [master]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Push site/ to gh-pages
        working-directory: site
        env:
          TOKEN: ${{ github.token }}
        run: |
          touch .nojekyll
          git init -q -b gh-pages
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "Site from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:$TOKEN@github.com/$GITHUB_REPOSITORY.git" gh-pages
