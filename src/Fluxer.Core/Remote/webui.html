<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Fluxer</title>
<style>
  :root {
    --bg: #f5f6f8; --surface: #ffffff; --edge: #e3e6eb; --text: #1b1f27; --subtle: #5b6475; --faint: #8a93a3;
    --accent: #2563eb; --accent-soft: rgba(37, 99, 235, .12); --ok: #16a34a; --warn: #c98a0b; --bad: #dc2626;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111317; --surface: #1a1d23; --edge: #2a2f38; --text: #e7e9ee; --subtle: #a3abba; --faint: #6f7889;
      --accent: #3b82f6; --accent-soft: rgba(59, 130, 246, .16); --ok: #22c55e; --warn: #e3a73c; --bad: #ef4444; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 "Segoe UI", system-ui, -apple-system, sans-serif; }
  header { position: sticky; top: 0; z-index: 2; background: var(--bg); padding: 14px 16px 10px; border-bottom: 1px solid var(--edge); }
  .row { display: flex; gap: 8px; align-items: center; }
  .logo { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 15px; }
  .logo svg { width: 20px; height: 20px; }
  header > * { max-width: 948px; margin-left: auto; margin-right: auto; }
  .totals { margin-left: auto; color: var(--subtle); font-size: 13px; white-space: nowrap; }
  .totals b { color: var(--accent); font-weight: 600; }
  form { margin-top: 10px; }
  header > form, header > .chips { display: flex; }
  input[type=url], input[type=password] { flex: 1; min-width: 0; height: 34px; padding: 0 10px; border-radius: 7px; border: 1px solid var(--edge);
    background: var(--surface); color: var(--text); font: inherit; }
  input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button { height: 34px; padding: 0 14px; border-radius: 7px; border: 1px solid var(--edge); background: var(--surface); color: var(--text);
    font: inherit; cursor: pointer; }
  button.accent { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.icon { width: 30px; height: 30px; padding: 0; display: grid; place-items: center; background: transparent; border-color: transparent; color: var(--subtle); }
  button.icon:hover { background: var(--accent-soft); color: var(--text); }
  button svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .chips { margin-top: 10px; gap: 6px; }
  .chip { height: 26px; padding: 0 10px; border-radius: 13px; font-size: 12.5px; color: var(--subtle); }
  .chip.on { background: var(--accent-soft); border-color: transparent; color: var(--accent); font-weight: 600; }
  .chips .spacer { flex: 1; }
  main { padding: 10px 16px 24px; max-width: 980px; margin: 0 auto; }
  .item { background: var(--surface); border: 1px solid var(--edge); border-radius: 9px; padding: 10px 10px 10px 14px; margin-bottom: 8px; }
  .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
  .meta { color: var(--subtle); font-size: 12.5px; margin-top: 2px; display: flex; gap: 10px; flex-wrap: wrap; }
  .state.downloading, .state.seeding, .state.starting, .state.verifying { color: var(--accent); }
  .state.completed { color: var(--ok); } .state.failed, .state.diskFull { color: var(--bad); } .state.paused, .state.needsLinkRefresh { color: var(--warn); }
  .bar { height: 4px; border-radius: 2px; background: var(--accent-soft); margin-top: 8px; overflow: hidden; }
  .bar > div { height: 100%; background: var(--accent); border-radius: 2px; transition: width .4s; }
  .item.completed .bar > div { background: var(--ok); }
  .empty, .note { color: var(--faint); text-align: center; padding: 40px 0; }
  .note { padding: 6px 0 0; text-align: left; font-size: 12.5px; }
  .note.bad { color: var(--bad); }
  dialog { border: 1px solid var(--edge); border-radius: 12px; background: var(--surface); color: var(--text); width: min(420px, 92vw); padding: 18px; }
  dialog::backdrop { background: rgba(0, 0, 0, .45); }
  dialog h2 { margin: 0 0 6px; font-size: 16px; }
  dialog p { margin: 0 0 12px; color: var(--subtle); font-size: 13px; }
</style>
</head>
<body>
<header>
  <div class="row">
    <span class="logo"><svg viewBox="0 0 24 24" aria-hidden="true"><rect width="24" height="24" rx="6" fill="var(--accent)"/><path d="M12 5v10M7.5 11l4.5 4.5 4.5-4.5M7 19h10" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>Fluxer</span>
    <span class="totals" id="totals"></span>
  </div>
  <form class="row" id="add">
    <input type="url" id="url" required autocomplete="off" spellcheck="false">
    <button class="accent" type="submit" id="addBtn"></button>
  </form>
  <div class="note" id="addNote" hidden></div>
  <div class="row chips" id="chips">
    <button class="chip on" data-f="all"></button>
    <button class="chip" data-f="active"></button>
    <button class="chip" data-f="done"></button>
    <span class="spacer"></span>
    <button class="icon" id="pauseAll"><svg viewBox="0 0 24 24"><path d="M9 5v14M15 5v14"/></svg></button>
    <button class="icon" id="resumeAll"><svg viewBox="0 0 24 24"><path d="M7 4l12 8-12 8z"/></svg></button>
  </div>
</header>
<main id="list"></main>
<dialog id="keyDlg">
  <form method="dialog" id="keyForm">
    <h2 id="keyTitle"></h2>
    <p id="keyText"></p>
    <div class="row"><input type="password" id="key" required autocomplete="off"><button class="accent" type="submit">OK</button></div>
  </form>
</dialog>
<script>
"use strict";
const tr = (navigator.language || "").toLowerCase().startsWith("tr");
const T = tr ? {
  url: "İndirilecek bağlantı veya magnet", add: "İndir", all: "Tümü", active: "Etkin", done: "Biten", pauseAll: "Tümünü duraklat",
  resumeAll: "Tümünü sürdür", pause: "Duraklat", resume: "Sürdür", remove: "Listeden kaldır", empty: "Liste boş.", keyTitle: "API anahtarı",
  keyText: "Fluxer → Ayarlar → Otomasyon → Uzaktan erişim'deki anahtarı girin.", added: "Eklendi.", dup: "Bu zaten listede.", bad: "Bağlantı geçersiz.",
  offline: "Fluxer'a ulaşılamıyor.", active_n: n => n + " etkin", removeAsk: n => "\"" + n + "\" listeden kaldırılsın mı? (Dosya silinmez)",
  states: { queued: "Sırada", starting: "Başlıyor", downloading: "İndiriliyor", paused: "Duraklatıldı", needsLinkRefresh: "Bağlantı yenilenmeli",
    diskFull: "Disk dolu", verifying: "Doğrulanıyor", seeding: "Paylaşılıyor", completed: "Tamamlandı", failed: "Başarısız", scheduled: "Zamanlandı" },
} : {
  url: "Link or magnet to download", add: "Download", all: "All", active: "Active", done: "Finished", pauseAll: "Pause all",
  resumeAll: "Resume all", pause: "Pause", resume: "Resume", remove: "Remove from list", empty: "The list is empty.", keyTitle: "API key",
  keyText: "Enter the key from Fluxer → Settings → Automation → Remote access.", added: "Added.", dup: "That is already in the list.", bad: "That link is not valid.",
  offline: "Fluxer cannot be reached.", active_n: n => n + " active", removeAsk: n => "Remove \"" + n + "\" from the list? (The file stays.)",
  states: { queued: "Queued", starting: "Starting", downloading: "Downloading", paused: "Paused", needsLinkRefresh: "Link needs refresh",
    diskFull: "Disk full", verifying: "Verifying", seeding: "Seeding", completed: "Completed", failed: "Failed", scheduled: "Scheduled" },
};
document.documentElement.lang = tr ? "tr" : "en";
const $ = id => document.getElementById(id);
$("url").placeholder = T.url; $("addBtn").textContent = T.add;
$("pauseAll").title = T.pauseAll; $("resumeAll").title = T.resumeAll;
$("keyTitle").textContent = T.keyTitle; $("keyText").textContent = T.keyText; $("key").placeholder = T.keyTitle;
document.querySelectorAll(".chip").forEach(c => c.textContent = T[c.dataset.f]);

// The key comes in the address fragment (never sent to the server) and is kept for this browser.
let key = "";
try { key = localStorage.getItem("fluxer-key") || ""; } catch (e) {}
const m = location.hash.match(/key=([A-Za-z0-9_-]+)/);
if (m) { key = m[1]; try { localStorage.setItem("fluxer-key", key); } catch (e) {} history.replaceState(null, "", location.pathname); }

let filter = "all", timer = 0;
const ACTIVE = ["starting", "downloading", "verifying", "seeding", "queued", "scheduled"];

async function api(method, path, body) {
  const r = await fetch("/api/v1/" + path, { method, headers: { "Authorization": "Bearer " + key, "Content-Type": "application/json" },
    body: body ? JSON.stringify(body) : undefined, cache: "no-store" });
  if (r.status === 401) { askKey(); throw new Error("401"); }
  return { status: r.status, data: await r.json().catch(() => ({})) };
}

function askKey() { clearTimeout(timer); if (!$("keyDlg").open) $("keyDlg").showModal(); }
$("keyForm").addEventListener("submit", () => {
  key = $("key").value.trim(); try { localStorage.setItem("fluxer-key", key); } catch (e) {} refresh();
});

const num = [new Intl.NumberFormat(tr ? "tr" : "en", { maximumFractionDigits: 1 }), new Intl.NumberFormat(tr ? "tr" : "en", { maximumFractionDigits: 0 })];
function bytes(n) {
  if (n == null || n < 0) return "—";
  const u = ["B", "KB", "MB", "GB", "TB"]; let i = 0;
  while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
  return num[i === 0 || n >= 100 ? 1 : 0].format(n) + " " + u[i];
}
function eta(s) {
  if (s == null) return "";
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), sec = s % 60;
  return h > 0 ? h + ":" + String(m).padStart(2, "0") + ":" + String(sec).padStart(2, "0") : m + ":" + String(sec).padStart(2, "0");
}
function icon(path) {
  const ns = "http://www.w3.org/2000/svg", svg = document.createElementNS(ns, "svg"), p = document.createElementNS(ns, "path");
  svg.setAttribute("viewBox", "0 0 24 24"); p.setAttribute("d", path); svg.appendChild(p); return svg;
}
function button(title, path, onClick) {
  const b = document.createElement("button"); b.className = "icon"; b.title = title; b.setAttribute("aria-label", title);
  b.appendChild(icon(path)); b.addEventListener("click", onClick); return b;
}
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

function render(items) {
  const list = $("list"); list.replaceChildren();
  const shown = items.filter(d => filter === "all" || (filter === "active" ? ACTIVE.includes(d.state) : d.state === "completed"))
    .sort((a, b) => b.addedAt - a.addedAt);
  if (shown.length === 0) { list.appendChild(el("div", "empty", T.empty)); return; }
  for (const d of shown) {
    const item = el("div", "item " + d.state), top = el("div", "row");
    top.appendChild(el("div", "name", d.name || d.url || "…"));
    const running = ["starting", "downloading", "verifying", "seeding", "queued"].includes(d.state);
    if (d.state !== "completed")
      top.appendChild(running ? button(T.pause, "M9 5v14M15 5v14", () => act("POST", "downloads/" + d.id + "/pause"))
                              : button(T.resume, "M7 4l12 8-12 8z", () => act("POST", "downloads/" + d.id + "/resume")));
    top.appendChild(button(T.remove, "M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13", () => { if (confirm(T.removeAsk(d.name))) act("DELETE", "downloads/" + d.id); }));
    item.appendChild(top);
    const meta = el("div", "meta");
    meta.appendChild(el("span", "state " + d.state, T.states[d.state] || d.state));
    meta.appendChild(el("span", null, d.size ? bytes(d.done) + " / " + bytes(d.size) : bytes(d.done)));
    if (d.speed > 0) meta.appendChild(el("span", null, "↓ " + bytes(d.speed) + "/s"));
    if (d.speed > 0 && d.eta != null) meta.appendChild(el("span", null, eta(d.eta)));
    if (d.error && d.state === "failed") meta.appendChild(el("span", null, d.error));
    item.appendChild(meta);
    const bar = el("div", "bar"), fill = el("div"); fill.style.width = Math.round(d.progress * 1000) / 10 + "%"; bar.appendChild(fill); item.appendChild(bar);
    list.appendChild(item);
  }
}

async function act(method, path, body) { try { await api(method, path, body); } catch (e) {} refresh(); }

async function refresh() {
  clearTimeout(timer);
  if (!key) { askKey(); return; }
  try {
    const [list, stats] = await Promise.all([api("GET", "downloads"), api("GET", "stats")]);
    render(list.data.downloads || []);
    $("totals").replaceChildren(el("b", null, "↓ " + bytes(stats.data.downloadSpeed) + "/s"), document.createTextNode(" · " + T.active_n(stats.data.active)));
  } catch (e) {
    if (e.message === "401") return;
    $("totals").textContent = T.offline;
  }
  timer = setTimeout(refresh, document.hidden ? 5000 : 1500);
}

$("add").addEventListener("submit", async ev => {
  ev.preventDefault();
  const note = $("addNote"), url = $("url").value.trim();
  try {
    const r = await api("POST", "downloads", { url });
    note.hidden = false; note.className = "note" + (r.status === 200 ? "" : " bad");
    note.textContent = r.status === 200 ? T.added : r.status === 409 ? T.dup : T.bad;
    if (r.status === 200) $("url").value = "";
    setTimeout(() => note.hidden = true, 3000);
  } catch (e) {}
  refresh();
});
document.querySelectorAll(".chip").forEach(c => c.addEventListener("click", () => {
  filter = c.dataset.f; document.querySelectorAll(".chip").forEach(x => x.classList.toggle("on", x === c)); refresh();
}));
$("pauseAll").addEventListener("click", () => act("POST", "pause-all"));
$("resumeAll").addEventListener("click", () => act("POST", "resume-all"));
document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
refresh();
</script>
</body>
</html>
